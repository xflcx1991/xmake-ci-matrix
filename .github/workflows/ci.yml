name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 2026-10 的 -latest 对应关系（actions/runner-images）：
        #   ubuntu-latest  -> Ubuntu 24.04 x64
        #   windows-latest -> Windows Server 2025 x64
        #   macos-latest   -> macOS 26 arm64
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show runner
        shell: bash
        run: |
          echo "matrix.os=${{ matrix.os }}"
          echo "runner.os=${{ runner.os }}"
          echo "runner.arch=${{ runner.arch }}"
          echo "ImageOS=${ImageOS:-unknown}"
          echo "ImageVersion=${ImageVersion:-unknown}"
          uname -a || true

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Build
        run: xmake -y

      - name: Run
        run: xmake run
